apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-token-reviewer
  namespace: inari
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
# Kubernetes populates this Secret after Argo CD creates it. Only this
# skeleton belongs in Git; never commit the generated token value.
apiVersion: v1
kind: Secret
metadata:
  name: vault-token-reviewer-token
  namespace: inari
  annotations:
    kubernetes.io/service-account.name: vault-token-reviewer
    argocd.argoproj.io/sync-wave: "-2"
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-token-reviewer
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault-token-reviewer
    namespace: inari
