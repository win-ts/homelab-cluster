apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-vault-auth
  namespace: inari
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
# Vault uses the short-lived client JWT to call Kubernetes TokenReview. This
# avoids storing a permanent reviewer token in Vault.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: inari-eso-vault-token-review
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: eso-vault-auth
    namespace: inari
